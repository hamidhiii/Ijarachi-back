{% load monitor_extras %}
<div class="pager">
  {% if page.has_previous %}<a class="btn ghost" href="{% page_url page.previous_page_number %}">← Назад</a>{% endif %}
  <span>Страница {{ page.number }} из {{ page.paginator.num_pages }} · всего {{ page.paginator.count }}</span>
  {% if page.has_next %}<a class="btn ghost" href="{% page_url page.next_page_number %}">Вперёд →</a>{% endif %}
</div>
