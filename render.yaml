services:
  # Web Service for the API and WebSockets
  - type: web
    name: synth-share-api
    env: python
    buildCommand: "./build.sh"
    startCommand: "daphne -b 0.0.0.0 -p $PORT core.asgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DJANGO_SETTINGS_MODULE
        value: core.settings
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: synth-share-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: synth-share-redis
          property: connectionString

  # Background Worker for Celery tasks
  - type: worker
    name: synth-share-worker
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "celery -A core worker -l info"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DJANGO_SETTINGS_MODULE
        value: core.settings
      - key: SECRET_KEY
        fromService:
          type: web
          name: synth-share-api
          property: envVar:SECRET_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: synth-share-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: synth-share-redis
          property: connectionString

  # Redis (Render Key Value)
  - type: keyvalue
    name: synth-share-redis
    ipAllowList: [] # Only allow internal connections
    plan: free # Note: Free tier expires in 90 days. Update to starter for production.

databases:
  - name: synth-share-db
    databaseName: synth_share
    user: synth_user
    plan: free # Note: Free tier expires in 90 days. Update to starter for production.
